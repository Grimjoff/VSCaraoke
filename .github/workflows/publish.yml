name: Publish

# Publishes to the Visual Studio Marketplace via Trusted Publishing (OIDC),
# so no Personal Access Token is stored anywhere.
#
# Release flow:  bump "version" in package.json -> commit -> git tag v0.2.1 -> git push --tags

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for --oidc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # vscode:prepublish runs type-check, lint and the production build.
      - name: Package
        run: npx @vscode/vsce package --out vscaraoke.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce publish --packagePath vscaraoke.vsix --oidc

      - uses: actions/upload-artifact@v4
        with:
          name: vscaraoke-vsix
          path: vscaraoke.vsix
